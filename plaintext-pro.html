<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plaintext Pro | Privacy-First Text Utility</title>
    <style>
        :root {
            --bg: #1e1e24;
            --panel: #26262e;
            --border: #34343f;
            --text: #e6e6ec;
            --muted: #9a9aa8;
            --accent: #4f6bed;
            --danger: #ff7676;
            --success: #4caf50;
        }

        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 1rem 2rem;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
        }

        .version {
            font-size: 0.8rem;
            color: var(--muted);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1rem;
            gap: 1rem;
            overflow: hidden;
        }

        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-height: 0;
        }

        label {
            font-size: 0.8rem;
            color: var(--muted);
            font-weight: 600;
            text-transform: uppercase;
        }

        textarea {
            flex: 1;
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 1rem;
            border-radius: 8px;
            font-family: 'ui-monospace', 'SFMono-Regular', Menlo, Monaco, Consolas, monospace;
            font-size: 0.9rem;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 0.5rem 0;
            justify-content: center;
        }

        button {
            background: var(--border);
            border: none;
            color: var(--text);
            padding: 0.6rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        button:hover {
            background: var(--accent);
        }

        button.primary {
            background: var(--accent);
        }

        button.danger {
            background: rgba(255, 118, 118, 0.1);
            color: var(--danger);
            border: 1px solid rgba(255, 118, 118, 0.3);
        }

        button.danger:hover {
            background: var(--danger);
            color: white;
        }

        .copy-btn {
            background: var(--success);
            margin-left: auto;
        }

        footer {
            padding: 0.5rem 2rem;
            background: var(--panel);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 2rem;
            font-size: 0.8rem;
            color: var(--muted);
        }

        .stat span {
            color: var(--text);
            font-weight: bold;
        }

        /* Responsive */
        @media (min-width: 768px) {
            main {
                flex-direction: row;
            }
            .toolbar {
                flex-direction: column;
                justify-content: center;
                width: 180px;
            }
            .copy-btn {
                margin-left: 0;
                margin-top: auto;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Plaintext Pro</h1>
        <div class="version">v1.0.0 • Local & Private</div>
    </header>

    <main>
        <div class="pane">
            <label for="input">Raw Input</label>
            <textarea id="input" placeholder="Paste your messy text here..."></textarea>
        </div>

        <div class="toolbar">
            <label>Actions</label>
            <button onclick="apply('clean')">Clean Smart</button>
            <button onclick="apply('smartMerge')">PDF Smart Merge</button>
            <button onclick="apply('mergeAll')">Merge All Lines</button>
            <button onclick="apply('prettify')">JSON Prettify</button>
            <button onclick="apply('anonymize')" class="danger">Anonymize</button>
            <button id="copyBtn" onclick="copyResult()" class="copy-btn">Copy Result</button>
        </div>

        <div class="pane">
            <label for="output">Cleaned Result</label>
            <textarea id="output" readonly placeholder="Result will appear here..."></textarea>
        </div>
    </main>

    <footer>
        <div class="stat">Words: <span id="wordCount">0</span></div>
        <div class="stat">Characters: <span id="charCount">0</span></div>
        <div style="margin-left: auto">All processing happens in your browser.</div>
    </footer>

    <script>
        const inputEl = document.getElementById('input');
        const outputEl = document.getElementById('output');
        const wordCountEl = document.getElementById('wordCount');
        const charCountEl = document.getElementById('charCount');
        const copyBtn = document.getElementById('copyBtn');

        function updateStats(text) {
            const chars = text.length;
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            wordCountEl.textContent = words;
            charCountEl.textContent = chars;
        }

        inputEl.addEventListener('input', (e) => {
            updateStats(e.target.value);
        });

        function apply(action) {
            const raw = inputEl.value;
            if (!raw) return;

            let result = '';

            switch (action) {
                case 'clean':
                    result = raw
                        .replace(/[“”]/g, '"')
                        .replace(/[‘’]/g, "'")
                        .replace(/[—–]/g, '-')
                        .replace(/[^\S\r\n]+/g, ' ') // Collapse spaces but keep newlines
                        .trim();
                    break;

                case 'smartMerge':
                    const lines = raw.split(/\r?\n/);
                    let merged = [];
                    for (let i = 0; i < lines.length; i++) {
                        let current = lines[i].trim();
                        if (i < lines.length - 1) {
                            let next = lines[i+1].trim();
                            // If next line starts with lowercase, merge it
                            if (next && /^[a-z]/.test(next)) {
                                merged.push(current + ' ');
                            } else {
                                merged.push(current + '\n');
                            }
                        } else {
                            merged.push(current);
                        }
                    }
                    result = merged.join('').trim();
                    break;

                case 'mergeAll':
                    result = raw.split(/\s+/).join(' ').trim();
                    break;

                case 'prettify':
                    try {
                        result = JSON.stringify(JSON.parse(raw), null, 2);
                    } catch (e) {
                        alert('Invalid JSON');
                        return;
                    }
                    break;

                case 'anonymize':
                    result = raw
                        .replace(/\b[\w\.-]+@[\w\.-]+\.\w{2,}\b/gi, '[EMAIL]')
                        .replace(/\b(?:\+?\d{1,3}[-.\s]?)?\(?\d{3}\)?[-.\s]?\d{3}[-.\s]?\d{4}\b/g, '[PHONE]');
                    break;
            }

            outputEl.value = result;
            updateStats(result);
        }

        async function copyResult() {
            const text = outputEl.value;
            if (!text) return;

            try {
                await navigator.clipboard.writeText(text);
                const originalText = copyBtn.innerText;
                copyBtn.innerText = 'Copied!';
                copyBtn.style.background = '#2e7d32';
                setTimeout(() => {
                    copyBtn.innerText = originalText;
                    copyBtn.style.background = '';
                }, 2000);
            } catch (err) {
                console.error('Failed to copy: ', err);
            }
        }
    </script>
</body>
</html>
