name: Release

# Cut a release by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# GitHub Actions is free and unlimited for public repos, so this builds the
# Windows installer + portable zip in the cloud and attaches them to a public
# GitHub Release — which has no download-bandwidth cap. That release page is
# your download link.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write        # needed to create the Release and upload assets
  id-token: write        # for build provenance attestation
  attestations: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prompt-assembly regression check
        run: npm test

      - name: Build installer + portable zip
        run: npm run dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            release/Roundtable-Setup-*.exe
            release/Roundtable-Setup-*.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false           # publish immediately — no manual UI step
          generate_release_notes: true
          files: |
            release/Roundtable-Setup-*.exe
            release/Roundtable-Setup-*.zip
